project:
  name: "sid_unet_baseline"
  seed: 42
  device: "auto"
  output_dir: "outputs"

data:
  dataset_name: "saberzl/SID_Set"
  streaming: true
  image_size: [256, 256]
  batch_size: 16
  num_workers: 2
  pin_memory: true
  shuffle_buffer_size: 1000
  train_split: "train"
  val_split: "validation"
  train_samples_per_epoch: -1  # Set to -1 or negative to run until dataset is depleted
  val_samples: -1              # Set to -1 or negative to run until dataset is depleted
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    random_rotate90: 0.5

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [64, 128, 256, 512]
  bilinear: true
  dropout: 0.1
  aux_classifier: true
  num_classes: 3

loss:
  mask_loss_type: "combined" # 'bce', 'dice', 'focal', 'combined'
  bce_weight: 0.5
  dice_weight: 0.5
  focal_gamma: 2.0
  focal_alpha: 0.25
  aux_loss_type: "cross_entropy"
  aux_weight: 0.2

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 1
  min_lr: 0.000001
  grad_clip_norm: 1.0
  amp: true
  save_best: true
  save_latest: true
  eval_interval: 1
  early_stopping_patience: 5
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 20
