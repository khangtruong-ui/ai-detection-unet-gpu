project:
  name: "sid_unet_streaming"
  seed: 42
  device: "auto"
  output_dir: "outputs/streaming_run"

data:
  dataset_name: "saberzl/SID_Set"
  streaming: true
  image_size: [256, 256]
  batch_size: 16
  num_workers: 2
  pin_memory: true
  shuffle_buffer_size: 1000
  train_split: "train"
  val_split: "validation"
  train_samples_per_epoch: 2000  # Set to -1 to run until dataset is depleted
  val_samples: 400              # Set to -1 to run until dataset is depleted
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    random_rotate90: 0.5

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [64, 128, 256, 512]
  bilinear: true
  dropout: 0.1
  aux_classifier: true
  num_classes: 3

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  aux_loss_type: "cross_entropy"
  aux_weight: 0.2

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  save_best: true
  save_latest: true
  early_stopping_patience: 5
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 25
