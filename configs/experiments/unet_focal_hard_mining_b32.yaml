# Configuration: Focal Loss & Hard Region Mining UNet
# Optimized for class-imbalanced small tampered / inpainting region segmentation
# Loss: Binary Focal Loss (gamma=2.5, alpha=0.35) + Aux Cross Entropy (weight=0.25)
# Features: [64, 128, 256, 512, 1024]
# Dataset budget: 5,000 train samples / epoch, 1,000 val samples

project:
  name: "sid_unet_focal_hard_mining_b32"
  seed: 42
  device: "auto"
  output_dir: "outputs/exp_unet_focal_b32"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  image_size: [256, 256]
  batch_size: 16
  num_workers: 4
  pin_memory: true
  shuffle_buffer_size: 2000
  train_split: "train"
  val_split: "validation"
  test_split: "test"
  train_samples_per_epoch: -1
  val_samples: -1
  test_samples: -1
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    random_rotate90: 0.5

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [64, 128, 256, 512, 1024]
  bilinear: true
  dropout: 0.15
  aux_classifier: true
  num_classes: 3

loss:
  mask_loss_type: "focal"       # Binary Focal Loss focusing on hard boundary pixels
  focal_gamma: 2.5
  focal_alpha: 0.35
  aux_loss_type: "cross_entropy"
  aux_weight: 0.25

training:
  epochs: 15
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 1
  min_lr: 0.000001
  grad_clip_norm: 1.0
  amp: true
  save_best: true
  save_latest: true
  eval_interval: 1
  early_stopping_patience: 5
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 25

