# Configuration: High-Resolution 512x512 Deep UNet
# Input resolution: [512, 512] for fine-grained synthetic boundary detection
# Features: [64, 128, 256, 512, 1024] (5 downsampling stages)
# Dataset budget: 4,000 train samples / epoch, 800 val samples

project:
  name: "sid_unet_highres_512_b16"
  seed: 42
  device: "auto"
  output_dir: "outputs/exp_unet_highres_512_b16"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  image_size: [512, 512]        # High resolution 512x512
  batch_size: 16
  num_workers: 4
  pin_memory: true
  shuffle_buffer_size: 2000
  train_split: "train"
  val_split: "validation"
  train_samples_per_epoch: -1
  val_samples: -1
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    random_rotate90: 0.5

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [64, 128, 256, 512, 1024]
  bilinear: true
  dropout: 0.1
  aux_classifier: true
  num_classes: 3

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  aux_loss_type: "cross_entropy"
  aux_weight: 0.2

training:
  epochs: 15
  learning_rate: 0.0003         # Slightly smaller LR for 512x512 gradient stability
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 1
  min_lr: 0.000001
  grad_clip_norm: 1.0
  amp: true                     # Essential for 512x512 VRAM optimization
  save_best: true
  save_latest: true
  eval_interval: 1
  early_stopping_patience: 5
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 25

