# Configuration: MSCCNet (ResNet-50 outstride=8 + Multi-Spectral Class Center)
# Multi-spectral Class Center Network for Face Manipulation Localization (ACM TOMM 2025)
# Official Repository: https://github.com/miaoct/MSCCNet (MIT License)
# Note: Official repo releases ImageNet-pretrained backbones only (resnet50_v1c);
# supply model.checkpoint_path if using a task-trained MSCCNet checkpoint.

project:
  name: "sid_msccnet_r50"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/msccnet_r50"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  normalize: true
  image_size: [512, 512]
  batch_size: 16
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "test"

model:
  name: "msccnet"
  backbone_depth: 50
  backbone_outstride: 8
  use_stem: true
  pretrained: true
  backbone_pretrained: true
  # Training-only: MSCCNet has no public task-trained checkpoint; allow_random_init
  # permits initializing the decoder/MSCC heads when training from ImageNet backbone.
  # Keep false (default) for inference so missing checkpoint_path fails cleanly.
  allow_random_init: true
  num_classes: 2
  feats_channels: 512
  out_channels: 512
  dropout: 0.1
  spectral_height: 64
  spectral_width: 64
  spectral_k: 2
  aux_classifier: true

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  aux_loss_type: "cross_entropy"
  aux_weight: 0.2

training:
  epochs: 20
  learning_rate: 0.0005
  weight_decay: 0.0005
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  precision: "auto"
