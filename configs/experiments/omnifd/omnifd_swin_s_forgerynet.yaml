# Configuration: OmniFD (Swin-S Unified ForgeryNet 50k)
# Official Pretrained Weights (Google Drive): omnifd_swin-s_50k_forgerynet.pth

project:
  name: "sid_omnifd_swin_s_forgerynet"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/omnifd_swin_s_forgerynet"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  normalize: true
  image_size: [224, 224]
  batch_size: 16
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "test"

model:
  name: "omnifd"
  variant: "swin-s"
  checkpoint_name: "omnifd_swin-s_50k_forgerynet"
  pretrained: true
  num_classes: 2
  latent_channels: 512
  num_latents: 64
  spatial_channels: 256
  aux_classifier: true
  has_image_head: true
  has_spatial_head: true

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  aux_loss_type: "cross_entropy"
  aux_weight: 0.2

training:
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  precision: "auto"
