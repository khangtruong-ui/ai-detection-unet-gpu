# Configuration: Heavy Wide & Deep Backbone UNet
# Features: [128, 256, 512, 1024] with Batch Size 32 and stronger dropout regularisation
# Dataset budget: 8,000 train samples / epoch, 1,600 val samples

project:
  name: "sid_unet_heavy_wide_deep_b32"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/unet_heavy_wide_deep_b32"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  image_size: [256, 256]
  batch_size: 16
  num_workers: 4
  pin_memory: true
  shuffle_buffer_size: 3000
  train_split: "train"
  val_split: "validation"
  test_split: "test"
  train_samples_per_epoch: -1
  val_samples: -1
  test_samples: -1
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.3
    random_rotate90: 0.5

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [128, 256, 512, 1024]
  bilinear: true
  dropout: 0.2                  # Higher dropout for large capacity model
  aux_classifier: false
  num_classes: 3

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  aux_loss_type: "cross_entropy"
  aux_weight: 0.25

training:
  epochs: 20
  learning_rate: 0.0004
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 2
  min_lr: 0.000001
  grad_clip_norm: 1.0
  amp: true
  save_best: true
  save_latest: false
  eval_interval: 1
  early_stopping_patience: 6
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 25

