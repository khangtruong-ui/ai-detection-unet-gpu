# Configuration: FOCAL with SAM ViT-Large Backbone (Strategy 1+ Mode 1B+: Anchored Full-Rank Contrastive Finetuning)
# Paper-Aligned Image-Relative Soft Contrastive Learning (MyInfoNCE) + Pristine-Only Anchor + LLRD + L2-SP
# Official Pretrained Weights: KhangTruong/FOCAL (FOCAL_ViT_weights.pth)

project:
  name: "sid_focal_vit_contrastive_strategy1_plus"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/focal_vit_contrastive_strategy1_plus"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  normalize: false
  image_size: [512, 512]
  batch_size: 32
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "validation"

model:
  name: "focal"
  backbone: "vit"
  pretrained: true
  hf_repo: "KhangTruong/FOCAL"
  finetune_mode: "contrastive"
  use_clustering: true
  force_vit_1024: false
  cluster_temperature: 0.1
  cluster_separability_threshold: 0.05
  contrastive_sample_size: 1024
  freeze_vit_stem_and_pos: true
  freeze_vit_blocks_below: 0
  llrd_enabled: true
  llrd_decay: 0.85
  llrd_min_scale: 0.02
  neck_lr_multiplier: 0.5
  prior_anchor_weight: 0.15
  prior_anchor_mode: "pristine_only"
  pristine_anchor_threshold: 0.05
  anchor_half_precision: true
  gradient_checkpointing: true
  l2_sp_weight: 0.0005
  aux_classifier: false
  num_classes: 2

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  align_weight: 1.0

training:
  epochs: 10
  learning_rate: 0.00005
  backbone_lr_multiplier: 0.5
  neck_lr_multiplier: 0.5
  freeze_backbone_epochs: 0
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  gradient_accumulation_steps: 1
  amp: true
  mixed_precision: "auto"
  precision: "auto"
