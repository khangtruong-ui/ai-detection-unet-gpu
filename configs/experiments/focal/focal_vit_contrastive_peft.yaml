# Configuration: FOCAL with SAM ViT-Large Backbone (Strategy B Mode 1B: Prior-Preserving Contrastive PEFT)
# Paper-Aligned Image-Relative Soft Contrastive Learning (MyInfoNCE) + Prior Anchoring + Unsupervised Clustering Eval
# Official Pretrained Weights: KhangTruong/FOCAL (FOCAL_ViT_weights.pth)

project:
  name: "sid_focal_vit_contrastive_peft"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/focal_vit_contrastive_peft"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  normalize: false
  image_size: [512, 512]
  batch_size: 8
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "validation"

model:
  name: "focal"
  backbone: "vit"
  pretrained: true
  hf_repo: "KhangTruong/FOCAL"
  finetune_mode: "contrastive"
  use_clustering: true
  force_vit_1024: false
  cluster_temperature: 0.1
  cluster_separability_threshold: 0.05
  contrastive_sample_size: 1024
  peft_enabled: true
  lora_r: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  use_dora: true
  lora_block_scope: "late_and_global"
  lora_target_modules: ["qkv", "proj"]
  train_neck: true
  train_vit_norms: false
  prior_anchor_weight: 0.1
  aux_classifier: false
  num_classes: 2

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  align_weight: 1.0

training:
  epochs: 10
  learning_rate: 0.00005
  neck_lr_multiplier: 0.25
  lora_lr_multiplier: 1.0
  lora_weight_decay: 0.01
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  gradient_accumulation_steps: 2
  amp: true
  mixed_precision: "auto"
  precision: "auto"
