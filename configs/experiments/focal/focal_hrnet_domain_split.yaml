# Configuration: FOCAL with HRNet-W32 Backbone — Domain-Split 4-Class Supervised Finetuning
# Joint Dataset: KhangTruong/IMD2020-CASIAv2-Joint (uses `dataset_source` column)
# Training Classes (4): 0=casia_pristine, 1=casia_tampered, 2=imd_pristine, 3=imd_tampered
# Inference Classes (2): collapses {0, 2} -> pristine and {1, 3} -> tampered via exact log-sum-exp

project:
  name: "sid_focal_hrnet_domain_split"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/focal_hrnet_domain_split"

data:
  dataset_name: "KhangTruong/IMD2020-CASIAv2-Joint"
  streaming: false
  normalize: false
  image_size: [512, 512]
  batch_size: 32
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "test"

model:
  name: "focal"
  backbone: "hrnet"
  pretrained: true
  hf_repo: "KhangTruong/FOCAL"
  finetune_mode: "supervised"
  use_clustering: false
  head_type: "decoder"
  domain_split_mode: true
  domain_loss_weight: 1.0
  domain_names: ["casia", "imd"]
  peft_enabled: true
  hrnet_trainable_stages: ["stage4"]
  freeze_backbone_bn: true
  use_feature_adapter: true
  prior_anchor_weight: 0.05
  aux_classifier: false
  num_classes: 2

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  edge_weight: 0.5
  edge_mask_width: 7
  align_weight: 1.0

training:
  epochs: 10
  learning_rate: 0.0002
  neck_lr_multiplier: 0.25
  backbone_lr_multiplier: 0.25
  freeze_backbone_epochs: 1
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  gradient_accumulation_steps: 1
  amp: true
  mixed_precision: "auto"
  precision: "auto"
