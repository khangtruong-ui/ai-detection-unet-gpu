# Configuration: FOCAL with HRNet-W32 Backbone (Strategy 1 Mode 1A: Supervised Finetuning)
# Forensic Contrastive Clustering for Image Forgery Detection and Localization
# Official Pretrained Weights: KhangTruong/FOCAL (FOCAL_HRNet_weights.pth)

project:
  name: "sid_focal_hrnet"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/focal_hrnet"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  normalize: false
  image_size: [512, 512]
  batch_size: 8
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "test"

model:
  name: "focal"
  backbone: "hrnet"
  pretrained: true
  hf_repo: "KhangTruong/FOCAL"
  finetune_mode: "supervised"
  use_clustering: false
  head_type: "decoder"
  aux_classifier: false
  num_classes: 2

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  edge_weight: 0.5
  edge_mask_width: 7

training:
  epochs: 10
  learning_rate: 0.0002
  backbone_lr_multiplier: 0.1
  freeze_backbone_epochs: 1
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  gradient_accumulation_steps: 2
  amp: true
  mixed_precision: "auto"
  precision: "auto"
