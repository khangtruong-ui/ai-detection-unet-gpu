# Configuration: Detective SAM (Adaptive AI-Image Forgery Localization)
# Based on ICLR 2026 paper:
# "Detective SAM: Adaptive AI-Image Forgery Localization"
# Integrates frozen SAM2 Hiera backbone with perturbation-driven forensic clues,
# multi-scale feature adapters (delta correction), and an automatic mask adapter
# (downscaled transformer + spatial gating).

project:
  name: "sid_detective_sam"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/detective_sam"

data:
  dataset_name: "KhangTruong/COCO-inpainted"
  streaming: true
  use_parquet_loader: true
  save_to_disk: true
  background_download: true
  columns: ["image", "mask"]
  image_size: [256, 256]
  batch_size: 32                     # Stable micro-batch for Tesla T4 GPU
  num_workers: -1
  pin_memory: true
  prefetch_batches: 32
  shuffle_buffer_size: 32
  train_split: "train"
  val_split: "validation"
  test_split: "validation"
  eval_split: "validation"
  train_samples_per_epoch: -1
  val_samples_per_epoch: -1
  val_samples: -1
  test_samples: -1
  evaluate_on_test: true
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    random_rotate90: 0.5
    color_jitter: 0.0

model:
  name: "detective_sam"
  variant: "small"
  pretrained_model_name_or_path: "facebook/sam2-hiera-small"
  layer_width: 64                   # Optimal adapter width d=64 (Table 16)
  noise_intensity: 0.75             # Optimal perturbation intensity (Table 16 & 17)
  perturbation_type: "blur_noise"   # Gaussian blur + Gaussian noise (Table 16)
  transformer_downscaling: 16       # 16x downscale for coarse transformer (Table 16)
  transformer_layers: 1             # 1 transformer layer (Table 16)
  dropout: 0.15                     # Dropout rate 0.15 (Table 16)
  target_size: [512, 512]           # Standard 512x512 resolution for faster throughput & lower VRAM
  freeze_sam2: true                 # SAM2 backbone remains frozen
  freeze_decoder: true              # Frozen decoder per paper Section 3.2
  multimask_output: false
  aux_classifier: false
  num_classes: 3
  in_channels: 3
  out_channels: 1

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5

training:
  epochs: 10
  learning_rate: 1.0e-3             # Optimal LR from paper Table 16 (0.001)
  weight_decay: 1.0e-4              # Adam weight decay from paper Table 16 (0.0001)
  gradient_accumulation_steps: 8   # 8 micro-batches * bs 2 = effective batch size 16
  mixed_precision: "bf16"
  clip_grad_norm: 1.0
  lr_scheduler: "cosine"
  warmup_epochs: 1
  min_lr: 1.0e-6
  save_best: true
  eval_every: 1
