# Configuration: SAM2 Small (Hiera) + QLoRA Baseline on COCO-inpainted
# Meta SAM2 small foundation model (facebook/sam2-hiera-small)
# with 4-bit NF4 NormalFloat quantization via bitsandbytes and Low-Rank Adaptation (LoRA r=8, alpha=16) via PEFT.

project:
  name: "sid_sam2_small"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/sam2_small"

data:
  dataset_name: "KhangTruong/COCO-inpainted"
  streaming: true
  use_parquet_loader: true
  save_to_disk: true
  background_download: true
  columns: ["image", "mask"]
  image_size: [256, 256]
  batch_size: 4                     # Tuned for 12GB VRAM budget (~9.6 GB peak reserved)
  num_workers: -1
  pin_memory: true
  prefetch_batches: 48
  shuffle_buffer_size: 32
  train_split: "train"
  val_split: "validation"
  test_split: "validation"
  eval_split: "validation"
  train_samples_per_epoch: -1
  val_samples_per_epoch: -1
  val_samples: -1
  test_samples: -1
  evaluate_on_test: true
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    random_rotate90: 0.5
    color_jitter: 0.0

model:
  name: "sam2"
  variant: "small"
  pretrained_model_name_or_path: "facebook/sam2-hiera-small"
  load_in_4bit: true
  load_in_8bit: false
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: ["qkv", "proj"]
  aux_classifier: false
  num_classes: 3
  in_channels: 3
  out_channels: 1
  target_size: [1024, 1024]
  use_mask_adapter: true
  freeze_decoder: false             # Unfreeze 4.2M mask decoder parameters to resolve 0.03 IoU bottleneck
  reinit_decoder: false             # If true, re-initializes mask decoder weights to break salient object bias

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5

training:
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  gradient_accumulation_steps: 4   # 4 micro-batches * bs 4 = effective batch size 16
  mixed_precision: "bf16"
  clip_grad_norm: 1.0
  lr_scheduler: "cosine"
  warmup_epochs: 1
  min_lr: 1.0e-6
  save_best: true
  eval_every: 1
