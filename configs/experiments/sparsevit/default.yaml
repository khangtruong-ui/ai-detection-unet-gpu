# Configuration: SparseViT (AAAI 2025, 50.3M params)
# Official Pretrained Weights (Google Drive): automatically resolved by SparseViT._resolve_checkpoint_path()

project:
  name: "sparsevit"
  seed: 42
  device: "auto"
  output_dir: "outputs/RUN/sparsevit"

data:
  dataset_name: "KhangTruong/IMD2020-CASIAv2-Joint"
  streaming: false
  normalize: false
  image_size: [512, 512]
  batch_size: 16
  num_workers: -1
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  test_split: "test"

model:
  name: "sparsevit"
  pretrained: true
  img_size: 512
  auto_normalize: true
  aux_classifier: false
  num_classes: 2

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5

training:
  epochs: 10
  learning_rate: 0.0002
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  precision: "auto"
