# Configuration: OpenSDI MaskCLIP (Lightweight ViT-B Backbones Recipe: Online CLIP ViT-B/16 + MAE ViT-B/16)
# Explores switching the heavy ViT-L/14 semantic backbone to the lighter ViT-B/16 backbone.
# NOTE ON PRETRAINED WEIGHTS:
#   Official OpenSDI checkpoints (nebula/MaskCLIP-weights) were trained exclusively with ViT-L/14
#   (visemb_dim=1024, align_dim=768). There are NO official pretrained OpenSDI checkpoints for ViT-B.
#   Attempting zero-shot inference without fine-tuning fails due to dimension mismatch in cross-attention.
#   This configuration is for training SPM from scratch on ViT-B foundation backbones (pretrained_mode="clip_mae").

project:
  name: "mask_clip_vitb_backbones"
  seed: 42
  device: "auto"
  output_dir: "outputs/experiments/mask_clip/vitb_backbones"

data:
  dataset_name: "KhangTruong/COCO-inpainted"
  streaming: true
  image_size: [512, 512]
  batch_size: 4
  num_workers: -1
  pin_memory: true
  prefetch_batches: 32
  shuffle_buffer_size: 32
  train_split: "train"
  val_split: "validation"
  test_split: "validation"
  eval_split: "validation"
  train_samples_per_epoch: -1
  val_samples_per_epoch: -1
  val_samples: -1
  test_samples: -1
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    random_rotate90: 0.5

model:
  name: "mask_clip"
  model_setting_name: "ViTB"
  pretrained: true
  pretrained_mode: "clip_mae"
  mae_pretrained_url: "https://dl.fbaipublicfiles.com/mae/pretrain/mae_pretrain_vit_base.pth"
  clip_model_name: "ViT-B/16"
  allow_random_init: false
  resolution: 512
  selected_layers: [1, 3, 5, 7, 9, 11]
  fusion_map:
    1: 0
    2: 1
    3: 2
    4: 3
    5: 4
    6: 5
  language_ctx: 10
  language_depth: 5
  aux_classifier: true
  num_classes: 2
  in_channels: 3
  out_channels: 1
  edge_lambda: 20.0
  edge_mask_width: 7
  input_normalize: true
  freeze_clip: true
  freeze_mae: false
  lora_r: 0

loss:
  mask_loss_type: "bce"
  bce_weight: 1.0
  dice_weight: 0.0
  focal_weight: 0.0
  aux_classifier: true
  aux_loss_type: "cross_entropy"
  aux_weight: 1.0
  edge_weight: 20.0
  edge_mask_width: 7

training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.05
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 4
  save_best: true
  save_latest: true
  checkpoint_period: 1
  early_stopping_patience: 5
  early_stopping_metric: "val_loss"
  early_stopping_mode: "min"

logging:
  log_interval: 20
  log_memory: true
