project:
  name: "sid_unet_quick_test"
  seed: 123
  device: "auto"
  output_dir: "outputs/quick_test"

data:
  dataset_name: "KhangTruong/IMD2020"
  streaming: false
  image_size: [128, 128]
  batch_size: 16
  num_workers: 0
  pin_memory: false
  train_samples_per_epoch: 6
  val_samples: 2
  augmentations:
    horizontal_flip: 0.0
    vertical_flip: 0.0
    random_rotate90: 0.0

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [16, 32, 64]
  bilinear: true
  dropout: 0.0
  aux_classifier: false
  num_classes: 3

loss:
  mask_loss_type: "dice"
  dice_weight: 1.0
  aux_loss_type: "cross_entropy"
  aux_weight: 0.0

training:
  epochs: 2
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  amp: false
  early_stopping_patience: 3
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 1

