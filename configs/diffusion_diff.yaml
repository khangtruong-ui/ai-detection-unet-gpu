# Top-level configuration for Diffusion-Diff (Multi-noise Latent Feature Decoder)
project:
  name: "diffusion_diff"
  seed: 42
  device: "auto"
  output_dir: "outputs/diffusion_diff"

data:
  dataset_name: "KhangTruong/COCO-inpainted"
  streaming: true
  image_size: [256, 256]
  batch_size: 8
  num_workers: 4
  pin_memory: true
  train_split: "train"
  val_split: "validation"
  train_samples_per_epoch: 2000
  val_samples: 200

model:
  name: "diffusion_diff"
  pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_subfolder: "vae"
  unet_subfolder: "unet"
  timesteps: [100, 250, 500]
  timestep_embed_dim: 32
  sigma_embed_dim: 32
  include_noisy_latents: true
  include_added_noise: true
  include_predicted_noise: true
  include_noise_diff: true
  include_z0: true
  scaling_factor: 0.18215
  # Trainable Decoder defined by config
  decoder:
    channels: [256, 128, 64, 32]
    upsample_mode: "bilinear"
    norm_layer: "batchnorm"
    activation: "silu"
    dropout: 0.1
    num_res_blocks: 1
  aux_classifier: true
  num_classes: 3
  in_channels: 3
  out_channels: 1
  input_rescale: true

loss:
  mask_loss_type: "combined"
  bce_weight: 0.5
  dice_weight: 0.5
  aux_classifier: true
  aux_loss_type: "cross_entropy"
  aux_weight: 0.2

training:
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  save_best: true
  save_latest: true
  early_stopping_patience: 4
  early_stopping_metric: "val_iou"
  early_stopping_mode: "max"

logging:
  log_interval: 20
