[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sid-unet"
version = "0.1.0"
description = "Config-driven UNet for AI-generated synthetic image segmentation"
readme = "README.md"
authors = [{ name = "KhangTruong" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0+cu128",
    "torchvision>=0.20.0",
    "datasets>=2.14.0",
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
sam = [
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
]
sam3 = [
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sid-train = "sid_unet.train:cli_main"
sid-eval = "sid_unet.evaluate:cli_main"
sid-cross-eval = "sid_unet.cross_eval:cli_main"
sid-predict = "sid_unet.predict:cli_main"
sid-illu = "sid_unet.illustration:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sid_unet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
