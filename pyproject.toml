[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sid-unet"
version = "0.1.0"
description = "Config-driven UNet for AI-generated synthetic image segmentation"
readme = "README.md"
authors = [{ name = "KhangTruong" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.20.0",
    "datasets>=2.14.0",
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.5.0",
    "transformers>=5.0.0",
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "iopath>=0.1.10",
    "parquet-dataset-loader @ git+https://github.com/khangtruong-ui/parquet-dataset-loader.git",
]

[project.optional-dependencies]
debug = [
    "nn-toolbox @ git+https://github.com/khangtruong-ui/nn-toolbox.git",
]
8bit = [
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
]
diffusion = [
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
]
diffusion-diff = [
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
]
sam = [
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "torchao>=0.16.0",
]
sam2 = [
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "torchao>=0.16.0",
]
sam3 = [
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "torchao>=0.16.0",
]
sam3-distil = [
    "sam3-distil @ git+https://github.com/khangtruong-ui/sam3-distil.git",
    "timm>=1.0.17",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "omegaconf>=2.3.0",
    "ftfy>=6.1.1",
    "regex",
    "iopath>=0.1.10",
    "einops>=0.7.0",
    "pycocotools>=2.0.7",
]
mask-clip = [
    "clip @ git+https://github.com/openai/CLIP.git",
    "timm>=1.0.15",
    "ftfy>=6.1.1",
    "regex",
    "huggingface-hub>=0.20.0",
    "peft>=0.7.0",
]
opensdi = [
    "clip @ git+https://github.com/openai/CLIP.git",
    "timm>=1.0.15",
    "ftfy>=6.1.1",
    "regex",
    "huggingface-hub>=0.20.0",
    "peft>=0.7.0",
]
iml = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "iopath>=0.1.10",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.0.0",
]
all = [
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
    "transformers>=5.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "torchao>=0.16.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.0.0",
    "nn-toolbox @ git+https://github.com/khangtruong-ui/nn-toolbox.git",
    "sam3-distil @ git+https://github.com/khangtruong-ui/sam3-distil.git",
    "clip @ git+https://github.com/openai/CLIP.git",
    "timm>=1.0.17",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "ftfy>=6.1.1",
    "regex",
    "iopath>=0.1.10",
    "einops>=0.7.0",
    "pycocotools>=2.0.7",
]

[project.scripts]
sid-train = "sid_unet.train:cli_main"
sid-eval = "sid_unet.evaluate:cli_main"
sid-cross-eval = "sid_unet.cross_eval:cli_main"
sid-predict = "sid_unet.predict:cli_main"
sid-illu = "sid_unet.illustration:cli_main"
sid-check-8bit = "sid_unet.utils.compatibility:cli_check_8bit"
sid-push = "sid_unet.checkpoint_sync:cli_push"
sid-pull = "sid_unet.checkpoint_sync:cli_pull"
sid-checkpoint = "sid_unet.checkpoint_sync:cli_main"
sid-cache = "sid_unet.cache.cli:cli_main"
sid-dataset-cache = "sid_unet.cache.cli:cli_main"
sid-copy-config = "sid_unet.config_copy:cli_main"
sid-kill = "sid_unet.kill:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sid_unet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
timeout = 240
addopts = "-v --tb=short --timeout=240"

[tool.sid_unet.mask_clip]
paper_title = "OpenSDI: Spotting Diffusion-Generated Images in the Open World (CVPR 2025)"
paper_arxiv = "https://arxiv.org/html/2503.19653v3"
hf_repo_id = "nebula/MaskCLIP-weights"
default_checkpoint = "MaskCLIP_sd15_20241108_09_14_22.pth"
available_checkpoints = [
    "MaskCLIP_sd15_20241108_09_14_22.pth",
    "MaskCLIP_sd15_20241109_08_53_19.pth",
    "MaskCLIP_sd15_20241103_17_45_16.pth",
    "MaskCLIP_sd15_20241103_17_45_19.pth",
]
mae_pretrained_url = "https://dl.fbaipublicfiles.com/mae/pretrain/mae_pretrain_vit_base.pth"
clip_vit_l14_url = "https://openaipublic.azureedge.net/clip/models/b8cca3fd41ae0c99ba7e8951adf17d267cdb84cd88be6f7c2e0eca1737a03836/ViT-L-14.pt"
clip_model_name = "ViT-L/14"
allow_random_init = false
default_resolution = 512
selected_layers = [2, 4, 8, 12, 16, 20, 23]
edge_lambda = 20.0
edge_mask_width = 7

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
nn-toolbox = { git = "https://github.com/khangtruong-ui/nn-toolbox.git" }
sam3-distil = { git = "https://github.com/khangtruong-ui/sam3-distil.git" }
parquet-dataset-loader = { git = "https://github.com/khangtruong-ui/parquet-dataset-loader.git" }
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

